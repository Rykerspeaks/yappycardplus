<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daily Meme</title>
<style>
body{
font-family:Arial;
text-align:center;
background:#f5f5f5;
padding:20px;
}
img{
max-width:90%;
border-radius:12px;
margin-top:20px;
}
</style>
</head>
<body>

<h1>😂 Daily Meme</h1>

<h2 id="title">Loading...</h2>

<img id="meme" src="">

<script>
fetch("https://meme-api.com/gimme")
.then(r=>r.json())
.then(data=>{
document.getElementById("title").innerText=data.title;
document.getElementById("meme").src=data.url;
});
</script>

</body>
</html>
